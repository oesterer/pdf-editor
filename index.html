<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF Editor</title>
<style>
:root{font:14px system-ui,sans-serif;color:#263344;background:#e9edf2}*{box-sizing:border-box}body{margin:0}header{background:#142337;color:white;padding:18px 24px;display:flex;align-items:center;gap:14px}h1{font-size:19px;margin:0}header span{color:#b5c5d7;font-size:12px}.toolbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;padding:12px 20px;border-bottom:1px solid #ccd4df}button,.file-button{font:inherit;border:1px solid #c8d1df;background:white;color:#263344;border-radius:6px;padding:8px 12px;cursor:pointer}button:hover,.file-button:hover{background:#edf3fa}button:disabled{opacity:.4;cursor:default}.primary{background:#2865d9;color:white;border-color:#2865d9}.primary:hover{background:#2056bb}button.active{background:#dce9ff;border-color:#2865d9}input[type=number]{width:62px;padding:7px;border:1px solid #c8d1df;border-radius:5px}input[type=color]{width:32px;height:32px;padding:2px;border:1px solid #c8d1df;background:white}.spacer{flex:1}#status{padding:10px 20px;color:#526176;min-height:38px}#workspace{padding:12px 20px 60px;overflow:auto;min-height:65vh}#empty{max-width:540px;margin:12vh auto;text-align:center;padding:45px 25px;background:#fff;border:2px dashed #bbc9da;border-radius:14px}#empty h2{font-size:24px}#empty p{color:#607086;line-height:1.7}.page{position:relative;margin:0 auto 25px;background:white;box-shadow:0 4px 20px #172b4426;touch-action:pan-y}.page canvas{display:block;width:100%;height:100%}.overlay{position:absolute;cursor:move;touch-action:none;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.2;outline:none}.overlay.selected{outline:2px solid #2865d9}.overlay img{width:100%;height:100%;display:block;pointer-events:none}.handle{position:absolute;right:-6px;bottom:-6px;width:12px;height:12px;background:white;border:2px solid #2865d9;cursor:nwse-resize}.overlay[contenteditable=true]{cursor:text;background:#ffffffd9;overflow:auto}.hint{font-size:12px;color:#687a8f}#documentName{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}dialog{border:0;border-radius:12px;width:min(440px,90vw);box-shadow:0 15px 60px #0005}dialog::backdrop{background:#14233780}dialog textarea{width:100%;height:120px;font:16px system-ui;margin:12px 0;padding:10px}dialog .actions{display:flex;justify-content:flex-end;gap:8px}@media(max-width:640px){header{padding:14px}header span{display:none}.toolbar{padding:9px;gap:5px}button{padding:7px 9px}#workspace{padding:10px 8px 40px}.hint{display:none}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>
<header><h1>PDF Editor</h1><span>Local files. In-browser editing.</span><div class="spacer"></div><small id="documentName">No document open</small></header>
<div class="toolbar" aria-label="PDF editing tools">
<button id="open" class="primary">Open PDF</button><input id="pdfFile" type="file" accept="application/pdf,.pdf" hidden>
<button id="addText" data-doc>Add text</button><button id="addImage" data-doc>Add image</button><input id="imageFile" type="file" accept="image/png,image/jpeg" hidden>
<label>Size <input id="fontSize" type="number" min="6" max="160" value="18" aria-label="Font size" data-doc></label><input id="color" type="color" value="#202020" aria-label="Text color" data-doc>
<button id="remove" data-doc>Delete</button><button id="zoomOut" data-doc aria-label="Zoom out">−</button><span id="zoomLabel">100%</span><button id="zoomIn" data-doc aria-label="Zoom in">+</button>
<div class="spacer"></div><button id="print" data-doc>Print</button><button id="save" class="primary" data-doc>Save PDF</button>
</div>
<div id="status" role="status" aria-live="polite">Open a PDF to start. Documents stay on your device.</div>
<main id="workspace"><div id="empty"><h2>A little room for your edits.</h2><p>Open or drop a PDF, add text and images, then save a new copy.</p><button id="emptyOpen" class="primary">Choose a PDF</button><p class="hint">Drag to move · Corner handle to resize · Double-click text to edit</p></div></main>
<dialog id="textDialog"><form method="dialog"><strong>Add text</strong><textarea id="newText" aria-label="Text to add" placeholder="Enter your text"></textarea><div class="actions"><button value="cancel">Cancel</button><button value="add" class="primary">Place text</button></div></form></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id);
let sourceBytes=null,pdf=null,items=[],selected=null,placement=null,scale=1,name='document.pdf',dirty=false,busy=false;
const pages=[];
let nextOverlayId=0;
function createOverlayId(){
  let id;
  do {
    id=typeof globalThis.crypto?.randomUUID==='function'
      ? globalThis.crypto.randomUUID()
      : 'overlay-'+Date.now().toString(36)+'-'+(nextOverlayId++).toString(36);
  } while(items.some(item=>item.id===id));
  return id;
}
function status(message){$('status').textContent=message;}
function controls(){document.querySelectorAll('[data-doc]').forEach(el=>el.disabled=!pdf||busy);$('open').disabled=busy;}
controls();
function select(id){selected=id;document.querySelectorAll('.overlay').forEach(el=>{el.classList.toggle('selected',el.dataset.id===id);el.querySelector('.handle')?.remove();if(el.dataset.id===id&&el.contentEditable!=='true'){const h=document.createElement('span');h.className='handle';el.append(h);}});const item=items.find(i=>i.id===id);if(item?.type==='text'){$('fontSize').value=item.size;$('color').value=item.color;}}
function setPlacement(value){placement=value;$('addText').classList.toggle('active',value?.type==='text');$('addImage').classList.toggle('active',value?.type==='image');}
function itemElement(item){const el=document.createElement('div');el.className='overlay';el.dataset.id=item.id;el.tabIndex=0;el.setAttribute('aria-label',item.type==='text'?'Text overlay: '+item.text:'Image overlay');el.style.left=item.x*scale+'px';el.style.top=item.y*scale+'px';el.style.width=item.w*scale+'px';el.style.height=item.h*scale+'px';if(item.type==='text'){el.textContent=item.text;el.style.fontSize=item.size*scale+'px';el.style.fontFamily='Helvetica,Arial,sans-serif';el.style.color=item.color;}else{const img=document.createElement('img');img.src=item.data;img.alt='';el.append(img);}
el.addEventListener('pointerdown',event=>{if(el.contentEditable==='true')return;event.stopPropagation();select(item.id);const resize=event.target.classList.contains('handle'),startX=event.clientX,startY=event.clientY,initial={...item};el.setPointerCapture(event.pointerId);const move=e=>{const dx=(e.clientX-startX)/scale,dy=(e.clientY-startY)/scale;const p=pages[item.page];if(resize){item.w=Math.max(20,Math.min(p.w-item.x,initial.w+dx));item.h=Math.max(16,Math.min(p.h-item.y,initial.h+dy));}else{item.x=Math.max(0,Math.min(p.w-item.w,initial.x+dx));item.y=Math.max(0,Math.min(p.h-item.h,initial.y+dy));}el.style.left=item.x*scale+'px';el.style.top=item.y*scale+'px';el.style.width=item.w*scale+'px';el.style.height=item.h*scale+'px';dirty=true;};el.addEventListener('pointermove',move);el.addEventListener('pointerup',()=>el.removeEventListener('pointermove',move),{once:true});el.addEventListener('pointercancel',()=>el.removeEventListener('pointermove',move),{once:true});});
el.addEventListener('dblclick',()=>{if(item.type!=='text')return;select(item.id);el.querySelector('.handle')?.remove();el.contentEditable='true';const before=item.text;el.focus();const finish=()=>{item.text=el.innerText;el.contentEditable='false';dirty=true;drawOverlays();};el.addEventListener('blur',finish,{once:true});el.onkeydown=e=>{e.stopPropagation();if(e.key==='Escape'){el.innerText=before;el.blur();}};});return el;}
function drawOverlays(){document.querySelectorAll('.overlay').forEach(el=>el.remove());for(const item of items)pages[item.page]?.el.append(itemElement(item));select(selected);}
async function render(){pages.length=0;$('workspace').replaceChildren();for(let n=1;n<=pdf.numPages;n++){const page=await pdf.getPage(n),base=page.getViewport({scale:1}),view=page.getViewport({scale});const el=document.createElement('div');el.className='page';el.style.width=view.width+'px';el.style.height=view.height+'px';el.setAttribute('aria-label','Page '+n);const canvas=document.createElement('canvas');const ratio=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.ceil(view.width*ratio);canvas.height=Math.ceil(view.height*ratio);el.append(canvas);$('workspace').append(el);pages.push({el,w:base.width,h:base.height});el.addEventListener('pointerdown',event=>{if(!placement){select(null);return;}const rect=el.getBoundingClientRect(),p=pages[n-1],w=Math.min(placement.w,p.w),h=Math.min(placement.h,p.h);const item={...placement,id:createOverlayId(),page:n-1,x:Math.max(0,Math.min(p.w-w,(event.clientX-rect.left)/scale)),y:Math.max(0,Math.min(p.h-h,(event.clientY-rect.top)/scale)),w,h};items.push(item);dirty=true;setPlacement(null);selected=item.id;drawOverlays();status('Drag to move, drag the corner to resize, or double-click text to edit.');});await page.render({canvasContext:canvas.getContext('2d'),viewport:view,transform:[ratio,0,0,ratio,0,0]}).promise;}
drawOverlays();$('zoomLabel').textContent=Math.round(scale*100)+'%';}
function toBase64(bytes){let result='';for(let i=0;i<bytes.length;i+=32768)result+=String.fromCharCode(...bytes.subarray(i,i+32768));return btoa(result);}
function fromBase64(value){return Uint8Array.from(atob(value),c=>c.charCodeAt(0));}
async function openFile(file){if(!file||busy)return;if(dirty&&!confirm('Discard your unsaved edits and open another PDF?'))return;busy=true;controls();status('Opening PDF…');try{if(!window.pdfjsLib||!window.PDFLib)throw Error('PDF libraries could not load. Check your internet connection and reload.');let bytes=new Uint8Array(await file.arrayBuffer()),restored=[];const doc=await PDFLib.PDFDocument.load(bytes);const embedded=doc.catalog.lookup(PDFLib.PDFName.of('BrowserPDFEditor'));if(embedded){const decoded=PDFLib.decodePDFRawStream(embedded).decode();const saved=JSON.parse(new TextDecoder().decode(decoded));if(saved.version!==1)throw Error('Unsupported editor data version.');bytes=fromBase64(saved.source);restored=saved.items;}
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const loaded=await pdfjsLib.getDocument({data:bytes.slice()}).promise;sourceBytes=bytes;pdf=loaded;items=restored;selected=null;setPlacement(null);name=file.name;scale=1;dirty=false;$('documentName').textContent=name;await render();status(`${pdf.numPages} page${pdf.numPages===1?'':'s'} · Add text or an image, then click a page to place it.`);}catch(error){status('Could not open PDF: '+error.message);}finally{busy=false;controls();$('pdfFile').value='';}}
$('open').onclick=$('emptyOpen').onclick=()=>$('pdfFile').click();$('pdfFile').onchange=e=>openFile(e.target.files[0]);
$('addText').onclick=()=>{$('newText').value='';$('textDialog').showModal();$('newText').focus();};$('textDialog').addEventListener('close',()=>{const text=$('newText').value;if($('textDialog').returnValue!=='add'||!text.trim())return;const size=Number($('fontSize').value)||18;setPlacement({type:'text',text,size,color:$('color').value,w:Math.max(120,Math.min(320,text.length*size*.55)),h:Math.max(size*1.3,text.split('\n').length*size*1.2)});status('Click a page to place your text. Press Escape to cancel.');});
$('addImage').onclick=()=>$('imageFile').click();$('imageFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(!['image/png','image/jpeg'].includes(file.type))throw Error('Choose a PNG or JPEG image.');const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('Image could not be read.'));reader.readAsDataURL(file);});const image=new Image();image.src=data;await image.decode();const factor=Math.min(1,240/Math.max(image.width,image.height));setPlacement({type:'image',data,w:image.width*factor,h:image.height*factor});status('Click a page to place your image.');}catch(error){status(error.message);}e.target.value='';};
for(const id of ['fontSize','color'])$(id).onchange=()=>{const item=items.find(i=>i.id===selected);if(item?.type==='text'){item.size=Math.max(6,Math.min(160,Number($('fontSize').value)||18));item.color=$('color').value;dirty=true;drawOverlays();}};
$('remove').onclick=()=>{if(selected){items=items.filter(i=>i.id!==selected);selected=null;dirty=true;drawOverlays();}};
async function zoom(delta){if(busy||!pdf)return;busy=true;controls();scale=Math.max(.4,Math.min(2.5,scale+delta));try{await render();}catch(e){status(e.message);}finally{busy=false;controls();}}
$('zoomIn').onclick=()=>zoom(.2);$('zoomOut').onclick=()=>zoom(-.2);
function wrappedLines(text,font,size,width){const result=[];for(const paragraph of text.split('\n')){let line='';for(const word of paragraph.split(' ')){const next=line?line+' '+word:word;if(line&&font.widthOfTextAtSize(next,size)>width){result.push(line);line=word;}else line=next;}result.push(line);}return result;}
async function exportPDF(editable){document.activeElement?.blur();const doc=await PDFLib.PDFDocument.load(sourceBytes);const font=await doc.embedFont(PDFLib.StandardFonts.Helvetica);for(const item of items){const page=doc.getPage(item.page),view=await pdf.getPage(item.page+1),viewport=view.getViewport({scale:1});let rotation=viewport.rotation;const point=(x,y)=>viewport.convertToPdfPoint(x,y);if(item.type==='text'){const rgb=item.color.match(/[a-f\d]{2}/gi).map(x=>parseInt(x,16)/255);const lines=wrappedLines(item.text,font,item.size,item.w);for(let i=0;i<lines.length;i++){if((i+1)*item.size*1.2>item.h+item.size*.2)break;const [x,y]=point(item.x,item.y+item.size+i*item.size*1.2);page.drawText(lines[i],{x,y,size:item.size,font,color:PDFLib.rgb(...rgb),rotate:PDFLib.degrees(rotation)});}}else{const image=item.data.startsWith('data:image/png')?await doc.embedPng(item.data):await doc.embedJpg(item.data);const [x,y]=point(item.x,item.y+item.h);page.drawImage(image,{x,y,width:item.w,height:item.h,rotate:PDFLib.degrees(rotation)});}}
if(editable){const payload=new TextEncoder().encode(JSON.stringify({version:1,source:toBase64(sourceBytes),items}));doc.catalog.set(PDFLib.PDFName.of('BrowserPDFEditor'),doc.context.register(doc.context.flateStream(payload)));}return doc.save();}
async function output(print){if(!pdf||busy)return;busy=true;controls();const printWindow=print?window.open('','_blank'):null;if(print&&!printWindow){busy=false;controls();status('Allow pop-ups to open the printable PDF.');return;}if(printWindow)printWindow.document.body.textContent='Preparing PDF…';status(print?'Preparing printable PDF…':'Saving PDF…');try{const bytes=await exportPDF(!print);const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));if(print){printWindow.location.href=url;status('PDF opened in a new tab. Use its print button or your browser’s Print command.');setTimeout(()=>URL.revokeObjectURL(url),300000);}else{const a=document.createElement('a');a.href=url;a.download=name.replace(/\.pdf$/i,'')+'-edited.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);dirty=false;status('PDF saved. Reopen it here to continue editing your overlays.');}}catch(error){printWindow?.close();status('Export failed: '+error.message+(/WinAnsi cannot encode/i.test(error.message)?' Text export currently supports the standard Helvetica character set.':''));}finally{busy=false;controls();}}
$('save').onclick=()=>output(false);$('print').onclick=()=>output(true);
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(e.target.tagName)||e.target.isContentEditable)return;if(e.key==='Escape'){setPlacement(null);select(null);status('Placement cancelled.');}if(e.key==='Delete'||e.key==='Backspace'){if(selected){e.preventDefault();$('remove').click();}}});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});document.addEventListener('dragover',e=>e.preventDefault());document.addEventListener('drop',e=>{e.preventDefault();const file=e.dataTransfer.files[0];if(file)openFile(file);});
</script>
</body>
</html>
